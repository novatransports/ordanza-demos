<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel de operación · Demo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ac:#0F5C6E; --ac2:#0B4553; --acs:#E3EEF0;
  --bg:#F3F1EB; --card:#FFFFFF; --ink:#1A1A18; --tx:#26261F; --mu:#6E6D66; --li:#E4E1D8; --li2:#EFEDE6;
  --sb:#1A1A18; --sbtx:#B9B8B0; --sbli:#2A2A27;
  --s-sol:#8A8A85; --s-con:#2F5DA8; --s-asi:#6B4FA8; --s-pro:#C98A12; --s-com:#1B6B4F; --s-can:#B23B3B; --s-nos:#4A4A48;
  --ok:#1B6B4F; --warn:#B7791F; --bad:#B23B3B;
  --r:6px; --ease:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --bg:#121311; --card:#1C1D1A; --ink:#F1EFE8; --tx:#E4E2DA; --mu:#9C9B93; --li:#2E2F2B; --li2:#252622; --acs:#173138;
  --sb:#0C0D0B; --sbli:#1F201D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,sans-serif;font-size:14px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.serif{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:300}
.num{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}
.hide{display:none!important}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.lg-box{width:100%;max-width:880px}
.lg-brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{width:42px;height:42px;border-radius:6px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.08em;font-size:14px;flex:none}
.lg-brand h1{font-size:30px;line-height:1.1}
.lg-brand p{color:var(--mu);font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
.lg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.lg-card{background:var(--card);border:1px solid var(--li);border-radius:8px;padding:22px;text-align:left;transition:border-color .3s var(--ease),transform .3s var(--ease)}
.lg-card:hover{border-color:var(--ac);transform:translateY(-2px)}
.lg-card .ico{width:22px;height:22px;color:var(--ac);margin-bottom:14px}
.lg-card b{display:block;font-size:16px;margin-bottom:6px;color:var(--ink)}
.lg-card span{color:var(--mu);font-size:13px}
.lg-note{margin-top:22px;color:var(--mu);font-size:12.5px;display:flex;gap:8px;align-items:center}
.demo-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);background:var(--acs);padding:4px 10px;border-radius:99px}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sb{width:236px;background:var(--sb);color:var(--sbtx);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:30;transition:transform .35s var(--ease)}
.sb-top{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid var(--sbli)}
.sb-top .logo{width:34px;height:34px;font-size:12px}
.sb-top b{color:#F4F2EC;font-size:14.5px;display:block;line-height:1.2}
.sb-top small{font-size:11px;color:#86857E;letter-spacing:.12em;text-transform:uppercase}
.sb nav{flex:1;overflow:auto;padding:10px 10px 20px}
.sb h6{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#6F6E68;padding:16px 10px 6px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:6px;color:var(--sbtx);font-size:13.5px;text-align:left;transition:background .2s,color .2s}
.nv:hover{background:#ffffff0d;color:#F4F2EC}
.nv.on{background:#ffffff14;color:#fff}
.nv.on .ico{color:#fff}
.nv .cnt{margin-left:auto;font-size:11px;background:var(--s-pro);color:#fff;border-radius:99px;padding:1px 7px;font-weight:600}
.sb-user{padding:14px 16px;border-top:1px solid var(--sbli);display:flex;align-items:center;gap:10px;font-size:12.5px}
.av{width:30px;height:30px;border-radius:50%;background:#33332F;color:#E9E7DF;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11.5px;flex:none}
.sb-user button{margin-left:auto;color:#86857E}
.sb-user button:hover{color:#fff}
.main{flex:1;margin-left:236px;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--li);display:flex;align-items:center;gap:14px;padding:14px 28px}
.topbar h2{font-size:24px;color:var(--ink);line-height:1.1}
.tb-date{color:var(--mu);font-size:13px}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.icbtn{width:36px;height:36px;border-radius:6px;border:1px solid var(--li);display:flex;align-items:center;justify-content:center;color:var(--tx);background:var(--card)}
.icbtn:hover{border-color:var(--mu)}
.burger{display:none}
.cnt{padding:24px 28px 60px;max-width:1400px}

/* BUTTONS / FORMS */
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;font-weight:600;font-size:13px;border:1px solid var(--li);background:var(--card);color:var(--tx);white-space:nowrap}
.btn:hover{border-color:var(--mu)}
a.btn{text-decoration:none}
.btn.pr{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pr:hover{background:var(--ac2)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn .ico{width:16px;height:16px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:11.5px;font-weight:600;color:var(--mu);letter-spacing:.04em}
.inp{height:38px;border:1px solid var(--li);border-radius:6px;background:var(--card);padding:0 11px;width:100%;outline:none}
textarea.inp{height:74px;padding:9px 11px;resize:vertical}
.inp:focus{border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* CARDS */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--li);border-radius:8px;padding:16px 18px}
.kpi small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.kpi b{display:block;font-size:26px;font-weight:600;color:var(--ink);margin:8px 0 2px;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--mu)}
.kpi .up{color:var(--ok)} .kpi .dn{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--li);border-radius:8px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--li)}
.card-h h3{font-size:14.5px;font-weight:600;color:var(--ink)}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.card-b{padding:16px 18px}
.grid-2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--ac)}

/* BADGES */
.bd{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap}
.st-Solicitado{background:var(--s-sol)} .st-Confirmado{background:var(--s-con)} .st-Asignado{background:var(--s-asi)}
.st-EnProceso{background:var(--s-pro)} .st-Completado{background:var(--s-com)} .st-Cancelado{background:var(--s-can)} .st-NoShow{background:var(--s-nos)}
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:600;background:var(--li2);color:var(--tx);white-space:nowrap}
.tag.ok{background:#1B6B4F1f;color:var(--ok)} .tag.warn{background:#B7791F22;color:var(--warn)} .tag.bad{background:#B23B3B1c;color:var(--bad)}

/* FILTERS */
.flt{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.pills{display:inline-flex;background:var(--card);border:1px solid var(--li);border-radius:6px;padding:3px}
.pills button{height:28px;padding:0 12px;border-radius:4px;font-size:12.5px;font-weight:600;color:var(--mu)}
.pills button.on{background:var(--ink);color:var(--bg)}
.srch{position:relative;flex:1;min-width:180px;max-width:320px}
.srch .ico{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--mu)}
.srch input{padding-left:32px}
.flt select.inp{width:auto;min-width:150px}
.flt .r{margin-left:auto;display:flex;gap:8px}

/* TABLE */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:10px 12px;border-bottom:1px solid var(--li);white-space:nowrap;cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0}
.t th:hover{color:var(--ink)}
.t th .ar{opacity:.35;margin-left:3px;font-size:10px}
.t th.sorted .ar{opacity:1;color:var(--ac)}
.t td{padding:11px 12px;border-bottom:1px solid var(--li2);vertical-align:middle;white-space:nowrap}
.t tbody tr{cursor:pointer;transition:background .15s}
.t tbody tr:hover{background:var(--li2)}
.t td.r,.t th.r{text-align:right}
.t tfoot td{font-weight:700;border-top:1px solid var(--li);border-bottom:0;padding-top:12px;color:var(--ink)}
.t .sub{display:block;font-size:11.5px;color:var(--mu)}
.empty{padding:40px;text-align:center;color:var(--mu)}
.mlist{display:none}

/* TIMELINE HOY */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--li2);cursor:pointer}
.tl-i:hover{background:var(--li2)}
.tl-i:last-child{border-bottom:0}
.tl-h{font-weight:700;font-size:14px;color:var(--ink)}
.tl-m b{font-weight:600;color:var(--ink);display:block}
.tl-m>span{font-size:12.5px;color:var(--mu);display:block}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--li2);font-size:13px;cursor:pointer}
.alert:last-child{border-bottom:0}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.ustat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px 18px}
.uchip{border:1px solid var(--li);border-radius:6px;padding:9px 11px;font-size:12.5px}
.uchip b{display:block;color:var(--ink);font-size:13px}
.uchip i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.uchip i:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#999)}

/* DESPACHO */
.dsp{overflow-x:auto}
.dsp-in{min-width:1080px;position:relative}
.dsp-hd,.dsp-row{display:grid;grid-template-columns:170px 1fr}
.dsp-hd{border-bottom:1px solid var(--li);position:sticky;top:0;background:var(--card);z-index:2}
.dsp-hours{position:relative;height:34px}
.dsp-hours span{position:absolute;top:10px;font-size:11px;color:var(--mu);transform:translateX(-50%)}
.dsp-row{border-bottom:1px solid var(--li2);min-height:58px}
.dsp-u{padding:10px 14px;border-right:1px solid var(--li2);font-size:12.5px}
.dsp-u b{display:block;color:var(--ink);font-size:13px}
.dsp-lane{position:relative;background-image:linear-gradient(to right,var(--li2) 1px,transparent 1px);background-size:calc(100% / 19) 100%}
.blk{position:absolute;top:8px;bottom:8px;border-radius:5px;color:#fff;font-size:11.5px;padding:5px 8px;overflow:hidden;cursor:pointer;line-height:1.25;white-space:nowrap;border-left:3px solid rgba(0,0,0,.25)}
.blk b{display:block;font-weight:700}
.now-ln{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3;pointer-events:none}
.now-ln:before{content:"Ahora";position:absolute;bottom:4px;left:4px;background:var(--card);padding:0 3px;font-size:10.5px;font-weight:700;color:var(--bad)}

/* UNIDADES */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-r{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;font-size:12.5px}
.bar-r b{color:var(--ink)}
.bar-t{height:22px;background:var(--li2);border-radius:4px;position:relative;overflow:hidden;display:flex}
.bar-t i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* GRUPOS */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:18px}
.gc{background:var(--card);border:1px solid var(--li);border-radius:8px;padding:18px;cursor:pointer;transition:border-color .25s}
.gc:hover,.gc.on{border-color:var(--ac)}
.gc h4{font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:20px;color:var(--ink);margin:6px 0 4px}
.gc .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mu);margin-top:10px}
.prog{height:6px;background:var(--li2);border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--ac)}

/* CHOFER VIEW */
.mine{max-width:560px}
.mc{background:var(--card);border:1px solid var(--li);border-radius:8px;padding:18px;margin-bottom:12px}
.mc-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mc-top .h{font-size:22px;font-weight:700;color:var(--ink)}
.mc-route{display:grid;grid-template-columns:16px 1fr;gap:4px 10px;font-size:14px;margin:12px 0}
.mc-route i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ac);margin-top:5px}
.mc-route i.f{background:var(--ac)}
.mc-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mc-acts .btn{height:46px;justify-content:center;font-size:14px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov.on{display:flex}
.md{background:var(--card);border-radius:8px;width:100%;max-width:640px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:mdin .35s var(--ease)}
.md.wide{max-width:860px}
@keyframes mdin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.md-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--li)}
.md-h h3{font-family:Fraunces,serif;font-style:italic;font-weight:400;font-size:22px;color:var(--ink)}
.md-h .x{margin-left:auto;color:var(--mu)}
.md-b{padding:20px 22px;overflow:auto}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--li);flex-wrap:wrap}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.dl div small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:3px}
.dl div b{font-weight:500;color:var(--ink)}
.sec{margin-top:20px}
.sec>.eyebrow{display:block;padding-bottom:8px;border-bottom:1px solid var(--li);margin-bottom:12px}
.hist{font-size:12.5px;color:var(--mu);display:flex;flex-direction:column;gap:6px}
.hist b{color:var(--tx);font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:13px;z-index:80;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

/* GUEST VIEW */
.gv{background:#FAF8F3;color:#1A1A18;border-radius:6px;padding:26px;border:1px solid #E4E1D8}
.gv h4{font-family:Fraunces,serif;font-style:italic;font-weight:300;font-size:28px;margin:8px 0 4px}
.gv .row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px solid #E4E1D8;font-size:13.5px}

/* RESPONSIVE */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media (max-width:860px){
  .sb{transform:translateX(-100%)}
  .sb.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .main{margin-left:0}
  .burger{display:flex}
  .topbar{padding:12px 16px;gap:10px}
  .topbar h2{font-size:20px}
  .tb-date,.tb-r .hide-m{display:none}
  .cnt{padding:16px 16px 60px}
  .lg-grid{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  .tw.has-m{display:none}
  .mlist{display:block}
  .mrow{display:flex;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--li2);cursor:pointer}
  .mrow:last-child{border-bottom:0}
  .mrow .l{flex:1;min-width:0}
  .mrow .l b{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .l span{font-size:12.5px;color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mrow .rr{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12.5px}
  .bar-r{grid-template-columns:96px 1fr 84px;font-size:12px}
  .srch{max-width:none;flex-basis:100%}
  .flt .r{margin-left:0}
  .dl{grid-template-columns:1fr 1fr}
  .md{max-height:calc(100vh - 20px)}
  .ov{padding:10px;align-items:flex-end}
}
@media (max-width:520px){
  .kpi b{font-size:22px}
  .g2,.g3{grid-template-columns:1fr}
  body{font-size:15px}
  .ustat{grid-template-columns:1fr 1fr}
  .tl-i{grid-template-columns:50px 1fr;padding:12px 16px}
  .tl-i>div:last-child{grid-column:2}
}

/* TOURS */
.cupo{display:inline-block;width:96px;height:6px;background:var(--li2);border-radius:99px;overflow:hidden;vertical-align:middle;margin-right:8px}
.cupo i{display:block;height:100%;background:var(--ac)}
.cupo.full i{background:var(--s-asi)}
.st-Solicitada{background:var(--s-sol)} .st-Confirmada{background:var(--s-con)} .st-Entour{background:var(--s-pro)} .st-Completada{background:var(--s-com)} .st-Cancelada{background:var(--s-can)}
.st-Abierta{background:var(--s-con)} .st-Llena{background:var(--s-asi)} .st-Encurso{background:var(--s-pro)} .st-Terminada{background:var(--s-com)}
.pk-card{margin-bottom:16px}
.pk{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:start;padding:13px 18px;border-bottom:1px solid var(--li2)}
.pk:last-child{border-bottom:0}
.pk .h{font-weight:700;font-size:15px;color:var(--ink)}
.pk .hn{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.pk .px{font-size:12.5px;color:var(--mu);margin-top:3px}
.pk .px span{display:block}
.pxr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 0}.pxr .tag{flex:none}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

function pickPais(){var tot=PAISES.reduce(function(a,p){return a+p.w},0),x=R()*tot;for(var i=0;i<PAISES.length;i++){x-=PAISES[i].w;if(x<=0)return PAISES[i]}return PAISES[0]}

var GENSTAMP='';
function genAll(){
  R=rngF(20261006);SAL=[];RES=[];GENSTAMP=TODAYS;
  var folio=1040,used={},sn=0,usedG={},usedV={};
  var a=addD(TODAY,-24),b=addD(TODAY,14);
  for(var d=new Date(a);d<=b;d=addD(d,1)){
    var f=iso(d),dow=d.getDay(),diff=Math.round((d-TODAY)/864e5);
    TOURS.forEach(function(t){
      if(t.dias.indexOf(dow)<0)return;
      var fill=t.pop*(diff>7?.45+R()*.35:diff>2?.6+R()*.35:.72+R()*.33);if(fill>1)fill=1;
      var s={id:'S'+(++sn),t:t.id,f:f,h:t.h,cap:t.cap,g:'',veh:''};
      var gs=GUIAS.filter(function(g){return g.ciudad===t.ciudad});
      if(diff<=2||R()<.55){var gl=gs.filter(function(g){return !usedG[f+g.id]});s.g=(gl.length?pick(gl):pick(gs)).id;usedG[f+s.g]=1;if(t.ciudad!=='Cusco')s.veh='Transporte aliado ('+t.ciudad+')';else{var vl=VEHS.slice(0,4).filter(function(v){return !usedV[f+v]&&(t.cap<=12||v.indexOf('19')>0)});s.veh=vl.length?vl[0]:VEHS[4];usedV[f+s.veh]=1}}
      SAL.push(s);
      var target=Math.round(t.cap*fill),pax=0,guard=0;
      while(pax<target&&guard++<30){
        var P=pickPais(),n,k=0;do{n=pick(P.fn)+' '+pick(P.ln)}while(used[n+f]&&k++<10);used[n+f]=1;
        var px=Math.min(target-pax,pick([1,2,2,2,3,4]));if(px<1)break;
        var total=t.precio*px,lead=ri(2,30),made=iso(addD(d,-lead));
        var r={id:'R'+(++folio),folio:'CM-'+folio,cli:n,tel:P.tel(),pais:P.p,pax:px,sal:s.id,hotel:pick(HOTELES[t.ciudad]),canal:pick(['WhatsApp','WhatsApp','WhatsApp','Correo','Correo','Agencia aliada','Página web','En oficina']),total:total,pagos:[],st:'Confirmada',hecho:made,hist:[]};
        var dep=Math.round(total*pick([.3,.3,.5])/5)*5,met=pick(METODOS.slice(0,4));
        if(diff<0){r.pagos.push({f:made,m:dep,met:met});r.pagos.push({f:f,m:total-dep,met:pick(['Efectivo','Yape','Transferencia'])});r.st=R()<.04?'No Show':'Completada'}
        else{
          var x=R();
          if(diff<=1){if(x<.55){r.pagos.push({f:made,m:dep,met:met})}else if(x<.92){r.pagos.push({f:made,m:total,met:met})}}
          else{if(x<.5){r.pagos.push({f:made,m:dep,met:met})}else if(x<.75){r.pagos.push({f:made,m:total,met:met})}else{r.st='Solicitada'}}
          if(diff===0&&toMin(s.h)<=nowMin()){r.st='En tour';var pg=r.pagos.reduce(function(a,p){return a+p.m},0);if(pg<total)r.pagos.push({f:f,m:total-pg,met:pick(['Efectivo','Yape'])})}
        }
        if(R()<.03&&diff!==0){r.st='Cancelada'}
        r.hist.push({t:fShort(made),a:'Reserva por '+r.canal});
        r.pagos.forEach(function(p){r.hist.push({t:fShort(p.f),a:'Pago '+money(p.m)+' · '+p.met})});
        RES.push(r);if(r.st!=='Cancelada')pax+=px;
      }
    });
  }
  /* dos salidas de mañana sin guía, para que se vea la alerta */
  var tm=iso(addD(TODAY,1)),c=0;SAL.forEach(function(s){if(s.t==='T01'&&(s.f===tm||s.f===TODAYS)){var o=s.g;SAL.forEach(function(x){if(x.f===s.f&&x.g==='G01'&&x!==s)x.g=o});s.g='G01'}});SAL.forEach(function(s){if(s.f===tm&&c<2&&tourBy(s.t).ciudad==='Cusco'&&s.t!=='T01'){s.g='';s.veh='';c++}});
}
function save(){try{localStorage.setItem(LSK,JSON.stringify({day:GENSTAMP,SAL:SAL,RES:RES}))}catch(e){}}
function load(){try{var o=JSON.parse(localStorage.getItem(LSK)||'null');if(o&&o.day===TODAYS){SAL=o.SAL;RES=o.RES;GENSTAMP=o.day;return true}}catch(e){}return false}
function resetDemo(){try{localStorage.removeItem(LSK)}catch(e){}UI.boarded={};genAll();save();renderAll();toast('Demo restablecido')}

<script>

/* ===================== HOY ===================== */
function rDash(){

    kpi('Salidas sin guía',SAL.filter(function(s){return s.f>=TODAYS&&s.f<=iso(addD(TODAY,2))&&!s.g&&paxOf(s.id)>0}).length,'próximas 48 horas')+'</div>';
  h+='<div class="grid-2"><div class="card"><div class="card-h"><h3>Salidas de hoy</h3><div class="r"><button class="btn sm" onclick="go(\'pick\')">'+ico('route')+'Ver pickups</button></div></div><div class="tl">'+
    (hoy.length?hoy.map(function(s){var t=tourBy(s.t),g=guiaBy(s.g),P=pickups(s);
      return '<div class="tl-i" onclick="openSal(\''+s.id+'\')"><div class="tl-h num">'+s.h+'</div><div class="tl-m"><b>'+esc(t.n)+'</b><span>'+t.ciudad+' · '+(g?esc(g.n):'<span style="color:var(--bad)">Sin guía</span>')+' · '+P.length+' hoteles · primer pickup '+(P[0]?P[0].h:'-')+'</span></div><div>'+cupo(s)+' &nbsp;'+badge(salSt(s))+'</div></div>'}).join(''):'<div class="empty">No hay salidas hoy.</div>')+'</div></div>';
  h+='<div class="card"><div class="card-h"><h3>Pendientes</h3></div>'+alertsHtml()+'</div></div>';

function alertsHtml(){
  var A=[],tm=iso(addD(TODAY,1)),t2=iso(addD(TODAY,2));

  var cob=RES.filter(function(r){return salBy(r.sal).f===tm&&saldo(r)>0}).length;
  if(cob)A.push({c:'var(--s-con)',t:'Mañana se cobran <b>'+cob+' saldos</b> en el pickup. Ya van en la ruta del guía.',a:"UI.pkD=1;go('pick')"});
  return A.length?A.map(function(x){return '<div class="alert" onclick="'+x.a+'"><span class="dot" style="background:'+x.c+'"></span><div>'+x.t+'</div></div>'}).join(''):'<div class="empty">Todo en orden.</div>';
}

  for(var i=1;i<=7;i++){var f=iso(addD(TODAY,i)),L=SAL.filter(function(s){return s.f===f}),cap=L.reduce(function(a,s){return a+s.cap},0),p=L.reduce(function(a,s){return a+paxOf(s.id)},0),w=cap?Math.round(p/cap*100):0;
    h+='<div class="bar-r"><b>'+fShort(f)+'</b><div class="bar-t"><i style="width:'+w+'%;background:var(--ac)"></i></div><span class="num mu">'+p+' / '+cap+' · '+w+'%</span></div>'}

}

  L.forEach(function(s){var t=tourBy(s.t),g=guiaBy(s.g),P=pickups(s),cob=resOf(s.id).reduce(function(a,r){return a+saldo(r)},0);
    h+='<div class="card pk-card"><div class="card-h"><div><h3>'+esc(t.n)+'</h3><span class="mu" style="font-size:12.5px">Sale '+s.h+' · '+t.ciudad+' · '+(g?esc(g.n):'<b style="color:var(--bad)">sin guía</b>')+' · '+(s.veh||'vehículo por asignar')+'</span></div><div class="r">'+cupo(s)+'<a class="btn sm" target="_blank" href="'+waGuia(s)+'">'+ico('phone')+'Ruta al guía</a></div></div>'+
      P.map(function(p){return '<div class="pk"><div class="h num">'+p.h+'</div><div><div class="hn">'+ico('pin')+esc(p.hotel)+'</div><div class="px">'+p.res.map(function(r){return '<div class="pxr"><span>'+esc(r.cli)+' · '+r.pax+(r.pax>1?' personas':' persona')+' · '+r.pais+'</span>'+(saldo(r)?'<span class="tag warn">Cobrar '+money(saldo(r))+'</span>':'<span class="tag ok">Pagado</span>')+'</div>'}).join('')+'</div></div></div>'}).join('')+
      '<div class="card-b mu" style="border-top:1px solid var(--li);display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px"><span><b>'+paxOf(s.id)+'</b> pasajeros</span><span><b>'+P.length+'</b> hoteles</span><span>Por cobrar en ruta: <b>'+money(cob)+'</b></span></div></div>'});
  return h;
}
</script>
<script>
/* ===================== RESERVAS ===================== */
var RES_COLS=[['folio','Folio'],['cli','Pasajero'],['tour','Tour'],['f','Salida'],['pax','Pax'],['hotel','Hotel'],['canal','Canal'],['total','Total'],['saldo','Saldo'],['st','Estatus']];
function resVal(r,k){var s=salBy(r.sal);if(k==='tour')return tourBy(s.t).n;if(k==='f')return s.f+s.h;if(k==='saldo')return saldo(r);return r[k]}
function resFiltered(){
  var q=UI.resQ.toLowerCase(),tm=iso(addD(TODAY,1)),w=iso(addD(TODAY,7));
  return RES.filter(function(r){var s=salBy(r.sal);
    if(UI.resF==='prox'&&s.f<TODAYS)return false;
    if(UI.resF==='hoy'&&s.f!==TODAYS)return false;
    if(UI.resF==='manana'&&s.f!==tm)return false;
    if(UI.resF==='semana'&&(s.f<TODAYS||s.f>w))return false;
    if(UI.resF==='saldo'&&(s.f<TODAYS||!saldo(r)))return false;
    if(UI.resF==='sinant'&&(s.f<TODAYS||r.st!=='Solicitada'))return false;
    if(q&&(r.cli+' '+r.folio+' '+r.hotel+' '+tourBy(s.t).n+' '+r.pais).toLowerCase().indexOf(q)<0)return false;
    return true});
}
function sortRes(k){UI.sort={k:k,d:UI.sort.k===k?-UI.sort.d:1};rResBody()}
function rRes(){
  var h='<div class="flt"><div class="pills">'+[['prox','Próximas'],['hoy','Hoy'],['manana','Mañana'],['semana','7 días'],['saldo','Con saldo'],['sinant','Sin anticipo'],['todas','Todas']].map(function(p){return '<button class="'+(UI.resF===p[0]?'on':'')+'" onclick="UI.resF=\''+p[0]+'\';refresh()">'+p[1]+'</button>'}).join('')+'</div>'+
    '<div class="srch">'+ico('search')+'<input class="inp" id="r-q" placeholder="Buscar pasajero, folio, hotel o tour" value="'+esc(UI.resQ)+'" oninput="UI.resQ=this.value;rResBody()"></div><div class="r"><button class="btn" onclick="xlsRes()">'+ico('dl')+'Excel</button></div></div>';
  return h+'<div class="card" id="res-body"></div>';
}
function rResBody(){
  var L=resFiltered().slice(),k=UI.sort.k,d=UI.sort.d;L.sort(function(a,b){var x=resVal(a,k),y=resVal(b,k);return (x<y?-1:x>y?1:0)*d});
  var th=RES_COLS.map(function(c){return '<th class="'+(c[0]===k?'sorted':'')+(c[0]==='total'||c[0]==='saldo'||c[0]==='pax'?' r':'')+'" onclick="sortRes(\''+c[0]+'\')">'+c[1]+'<span class="ar">'+(c[0]===k?(d>0?'▲':'▼'):'↕')+'</span></th>'}).join('');
  var shown=L.slice(0,120);
  var h='<div class="tw has-m"><table class="t"><thead><tr>'+th+'</tr></thead><tbody>'+shown.map(function(r){var s=salBy(r.sal),t=tourBy(s.t);
    return '<tr onclick="openRes(\''+r.id+'\')"><td class="num">'+r.folio+'</td><td><b style="font-weight:600">'+esc(r.cli)+'</b><span class="sub">'+r.pais+'</span></td><td>'+esc(t.n)+'</td><td>'+fDay(s.f)+' <span class="mu num">'+s.h+'</span></td><td class="r num">'+r.pax+'</td><td>'+esc(r.hotel)+'</td><td>'+r.canal+'</td><td class="r num">'+money(r.total)+'</td><td class="r num">'+(saldo(r)?money(saldo(r)):'<span class="tag ok">Pagado</span>')+'</td><td>'+badge(r.st)+'</td></tr>'}).join('')+'</tbody></table></div>';
  h+='<div class="mlist">'+shown.map(function(r){var s=salBy(r.sal),t=tourBy(s.t);return '<div class="mrow" onclick="openRes(\''+r.id+'\')"><div class="l"><b>'+esc(r.cli)+' · '+r.pax+' pax</b><span>'+esc(t.n)+' · '+fDay(s.f)+'</span></div><div class="rr">'+badge(r.st)+pagoTag(r)+'</div></div>'}).join('')+'</div>';
  if(!L.length)h+='<div class="empty">No hay reservas con ese filtro.</div>';
  else h+='<div class="card-b mu" style="border-top:1px solid var(--li);font-size:12.5px">'+L.length+' reservas · '+L.reduce(function(a,r){return a+(r.st==='Cancelada'?0:r.pax)},0)+' pasajeros'+(L.length>120?' · se muestran las primeras 120':'')+'</div>';
  $('res-body').innerHTML=h;
}
var _rRes=rRes;rRes=function(){setTimeout(rResBody,0);return _rRes()};

function confTxt(r){var s=salBy(r.sal),t=tourBy(s.t),L=langOf(r.tel),en=L==='en',first=r.cli.split(' ')[0];
  return en?('Hello '+first+', your booking is confirmed.\n'+t.n+'\n'+fLong(s.f,'en')+'\nPickup: '+fTime(pickOf(r),'en')+' at '+r.hotel+'\nGuests: '+r.pax+'\nBalance due: '+money(saldo(r))+'\nBooking '+r.folio)
    :('Hola '+first+', tu reserva está confirmada.\n'+t.n+'\n'+fLong(s.f)+'\nRecojo: '+pickOf(r)+' h en '+r.hotel+'\nPersonas: '+r.pax+'\nSaldo: '+money(saldo(r))+'\nFolio '+r.folio)}
function openRes(id){
  cRid=id;var r=resBy(id),s=salBy(r.sal),t=tourBy(s.t),L=langOf(r.tel);
  var h='<div class="md-h"><div><span class="eyebrow">'+r.folio+' · '+r.canal+'</span><h3>'+esc(r.cli)+'</h3></div><button class="x" onclick="cM()">'+ico('x')+'</button></div><div class="md-b">';
  h+='<div class="dl"><div><small>Tour</small><b>'+esc(t.n)+'</b></div><div><small>Salida</small><b>'+fLong(s.f)+' · '+s.h+' h</b></div><div><small>Recojo</small><b>'+pickOf(r)+' h · '+esc(r.hotel)+'</b></div><div><small>Personas</small><b>'+r.pax+'</b></div><div><small>Teléfono</small><b>'+esc(r.tel)+' <span class="mu">· '+r.pais+'</span></b></div><div><small>Estatus</small><b>'+badge(r.st)+' '+pagoTag(r)+'</b></div></div>';
  h+='<div class="sec"><span class="eyebrow">Pagos</span><div class="dl" style="margin-bottom:12px"><div><small>Total</small><b>'+money(r.total)+'</b></div><div><small>Saldo</small><b>'+money(saldo(r))+'</b></div></div>'+
    (r.pagos.length?r.pagos.map(function(p){return '<div class="gpk"><span>'+fShort(p.f)+' · '+p.met+'</span><b class="num">'+money(p.m)+'</b></div>'}).join(''):'<div class="mu">Todavía no hay pagos.</div>')+
    (saldo(r)?'<div class="g3" style="margin-top:12px"><div class="fld"><label>Monto (US$)</label><input class="inp" id="p-m" value="'+saldo(r)+'"></div><div class="fld"><label>Método</label><select class="inp" id="p-met">'+METODOS.map(function(m){return '<option>'+m+'</option>'}).join('')+'</select></div><div class="fld"><label>&nbsp;</label><button class="btn ink" onclick="addPago()">Registrar pago</button></div></div>':'')+'</div>';
  h+='<div class="sec"><span class="eyebrow">Estatus</span><div style="display:flex;gap:8px;flex-wrap:wrap">'+['Solicitada','Confirmada','Completada','No Show','Cancelada'].map(function(x){return '<button class="btn sm'+(r.st===x?' ink':'')+'" onclick="setRes(\''+x+'\')">'+x+'</button>'}).join('')+'</div></div>';
  h+='<div class="sec"><span class="eyebrow">Historial</span><div class="hist">'+r.hist.map(function(x){return '<div><b>'+x.t+'</b> · '+esc(x.a)+'</div>'}).join('')+'</div></div>';
  h+='</div><div class="md-f"><span class="mu" style="font-size:12px;margin-right:auto;align-self:center">Se manda en '+(L==='es'?'español':'inglés')+' por la lada.</span><a class="btn" target="_blank" href="https://wa.me/'+r.tel.replace(/\D/g,'')+'?text='+encodeURIComponent(confTxt(r))+'">'+ico('phone')+'WhatsApp al cliente</a><button class="btn pr" onclick="pdfConf(\''+id+'\')">'+ico('pdf')+'Confirmación PDF</button></div>';
  oM(h,true);
}
function addPago(){var r=resBy(cRid),m=+String($('p-m').value).replace(/[^\d.]/g,'');if(!m){toast('Falta el monto');return}var met=$('p-met').value;r.pagos.push({f:TODAYS,m:m,met:met});if(r.st==='Solicitada')r.st='Confirmada';r.hist.push({t:stamp(),a:'Pago '+money(m)+' · '+met+' (registró '+CU.n+')'});save();openRes(r.id);refresh();toast('Pago registrado')}
function setRes(st){var r=resBy(cRid);r.st=st;r.hist.push({t:stamp(),a:'Estatus: '+st+' ('+CU.n+')'});save();openRes(r.id);refresh()}

/* nueva reserva */
function openNew(){
  var h='<div class="md-h"><div><span class="eyebrow">Nueva reserva</span><h3>Datos del pasajero</h3></div><button class="x" onclick="cM()">'+ico('x')+'</button></div><div class="md-b">'+
  '<div class="g2"><div class="fld"><label>Tour</label><select class="inp" id="n-t" onchange="nUpd()">'+TOURS.map(function(t){return '<option value="'+t.id+'">'+esc(t.n)+' · '+t.ciudad+'</option>'}).join('')+'</select></div>'+
  '<div class="fld"><label>Fecha de salida</label><input class="inp" type="date" id="n-f" value="'+iso(addD(TODAY,2))+'" onchange="nUpd()"></div></div>'+
  '<div id="n-cupo" class="mu" style="font-size:12.5px;margin:8px 0 14px"></div>'+
  '<div class="g2"><div class="fld"><label>Nombre</label><input class="inp" id="n-cli" placeholder="Nombre y apellido"></div><div class="fld"><label>WhatsApp</label><input class="inp" id="n-tel" placeholder="+1 305 555 0100" oninput="nUpd()"></div></div>'+
  '<div class="g3" style="margin-top:12px"><div class="fld"><label>Personas</label><input class="inp" type="number" min="1" id="n-pax" value="2" oninput="nUpd()"></div><div class="fld"><label>Hotel</label><select class="inp" id="n-h"></select></div><div class="fld"><label>Canal</label><select class="inp" id="n-c">'+CANALES.map(function(c){return '<option>'+c+'</option>'}).join('')+'</select></div></div>'+
  '<div class="g3" style="margin-top:12px"><div class="fld"><label>Total (US$)</label><input class="inp" id="n-tot"></div><div class="fld"><label>Anticipo (US$)</label><input class="inp" id="n-ant" value="0"></div><div class="fld"><label>Método</label><select class="inp" id="n-met">'+METODOS.map(function(m){return '<option>'+m+'</option>'}).join('')+'</select></div></div>'+
  '<div id="n-lang" class="mu" style="font-size:12.5px;margin-top:10px"></div></div><div class="md-f"><button class="btn" onclick="cM()">Cancelar</button><button class="btn pr" onclick="saveNew()">Guardar reserva</button></div>';
  oM(h,true);nUpd(true);
}
function nSal(){var t=$('n-t').value,f=$('n-f').value;return SAL.filter(function(s){return s.t===t&&s.f===f})[0]}
function nUpd(){var t=tourBy($('n-t').value),s=nSal(),pax=Math.max(1,+$('n-pax').value||1);
  var hs=HOTELES[t.ciudad],cur=$('n-h').value;$('n-h').innerHTML=hs.map(function(x){return '<option'+(x===cur?' selected':'')+'>'+x+'</option>'}).join('');
  $('n-tot').value=t.precio*pax;
  var libres=s?s.cap-paxOf(s.id):t.cap;
  $('n-cupo').innerHTML=(s?'Salida de las '+s.h+' h · ':'Se abre una salida nueva ese día · ')+'<b style="color:'+(pax>libres?'var(--bad)':'var(--ok)')+'">'+(pax>libres?'Solo quedan '+libres+' cupos':libres+' cupos libres')+'</b>';
  var tel=$('n-tel').value;$('n-lang').textContent=tel?'La confirmación se manda en '+(langOf(tel)==='es'?'español':'inglés')+' (por la lada).':''}
function saveNew(){
  var t=tourBy($('n-t').value),f=$('n-f').value,cli=$('n-cli').value.trim(),tel=$('n-tel').value.trim(),pax=Math.max(1,+$('n-pax').value||1);
  if(!cli||!tel||!f){toast('Faltan nombre, WhatsApp o fecha');return}
  var s=nSal();if(!s){s={id:'S'+(SAL.length+1)+'n',t:t.id,f:f,h:t.h,cap:t.cap,g:'',veh:''};SAL.push(s)}
  if(paxOf(s.id)+pax>s.cap){toast('No caben: quedan '+(s.cap-paxOf(s.id))+' cupos');return}
  var n=RES.length+1041,ant=+$('n-ant').value||0,r={id:'R'+n+'n',folio:'CM-'+n,cli:cli,tel:tel,pais:langOf(tel)==='es'?'Hispanohablante':'Extranjero',pax:pax,sal:s.id,hotel:$('n-h').value,canal:$('n-c').value,total:+$('n-tot').value||t.precio*pax,pagos:[],st:ant?'Confirmada':'Solicitada',hecho:TODAYS,hist:[{t:stamp(),a:'Reserva por '+$('n-c').value+' (registró '+CU.n+')'}]};
  if(ant){r.pagos.push({f:TODAYS,m:ant,met:$('n-met').value});r.hist.push({t:stamp(),a:'Anticipo '+money(ant)+' · '+$('n-met').value})}
  RES.push(r);save();cM();UI.resF='prox';UI.resQ='';go('res');setTimeout(function(){openRes(r.id)},50);toast('Reserva guardada')
}

/* ===================== COBRANZA ===================== */
function rCob(){
  var m0=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),1));
  var mes=RES.filter(function(r){return r.hecho>=m0&&r.st!=='Cancelada'});
  var vend=mes.reduce(function(a,r){return a+r.total},0);
  var cobr=RES.reduce(function(a,r){return a+r.pagos.filter(function(p){return p.f>=m0}).reduce(function(x,p){return x+p.m},0)},0);
  var fut=RES.filter(function(r){return salBy(r.sal).f>=TODAYS&&saldo(r)>0}),porc=fut.reduce(function(a,r){return a+saldo(r)},0);
  var ant7=RES.reduce(function(a,r){return a+r.pagos.filter(function(p){return p.f>=iso(addD(TODAY,-6))&&p.f<=TODAYS&&salBy(r.sal).f>p.f}).reduce(function(x,p){return x+p.m},0)},0);
  var h='<div class="kpis">'+kpi('Vendido este mes',money(vend),mes.length+' reservas')+kpi('Cobrado este mes',money(cobr),'anticipos y saldos')+kpi('Por cobrar',money(porc),fut.length+' reservas próximas')+kpi('Anticipos 7 días',money(ant7),'de tours que aún no salen')+'</div>';
  var by={};mes.forEach(function(r){var t=salBy(r.sal).t;by[t]=(by[t]||0)+r.total});
  var rows=TOURS.map(function(t){return [t,by[t.id]||0]}).sort(function(a,b){return b[1]-a[1]}),mx=rows[0][1]||1;
  var ch={};mes.forEach(function(r){ch[r.canal]=(ch[r.canal]||0)+r.total});
  h+='<div class="grid-2"><div class="card"><div class="card-h"><h3>Ventas del mes por tour</h3></div><div class="card-b"><div class="bars">'+rows.map(function(x){return '<div class="bar-r"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x[0].n)+'</b><div class="bar-t"><i style="width:'+Math.round(x[1]/mx*100)+'%;background:var(--ac)"></i></div><span class="num mu">'+money(x[1])+'</span></div>'}).join('')+'</div></div></div>';
  h+='<div class="card"><div class="card-h"><h3>Por dónde llegan</h3></div><div class="card-b"><div class="bars">'+CANALES.map(function(c){var v=ch[c]||0;return '<div class="bar-r" style="grid-template-columns:110px 1fr 90px"><b>'+c+'</b><div class="bar-t"><i style="width:'+Math.round(v/(vend||1)*100)+'%;background:var(--ink)"></i></div><span class="num mu">'+Math.round(v/(vend||1)*100)+'%</span></div>'}).join('')+'</div></div></div></div>';
  fut.sort(function(a,b){return resVal(a,'f')<resVal(b,'f')?-1:1});
  h+='<div class="card"><div class="card-h"><h3>Saldos por cobrar</h3><span class="mu" style="font-size:12.5px">ordenados por fecha de salida</span><div class="r"><button class="btn sm" onclick="UI.resF=\'saldo\';go(\'res\')">Ver en reservas</button></div></div><div class="tw"><table class="t"><thead><tr><th>Salida</th><th>Pasajero</th><th>Tour</th><th class="r">Total</th><th class="r">Pagado</th><th class="r">Saldo</th><th>Pago</th></tr></thead><tbody>'+
    fut.slice(0,14).map(function(r){var s=salBy(r.sal);return '<tr onclick="openRes(\''+r.id+'\')"><td>'+fDay(s.f)+'</td><td><b style="font-weight:600">'+esc(r.cli)+'</b><span class="sub">'+r.folio+'</span></td><td>'+esc(tourBy(s.t).n)+'</td><td class="r num">'+money(r.total)+'</td><td class="r num">'+money(pagado(r))+'</td><td class="r num"><b>'+money(saldo(r))+'</b></td><td>'+pagoTag(r)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  return h;
}

/* ===================== TOURS Y GUÍAS ===================== */
function rTours(){
  return '<div class="tcards">'+TOURS.map(function(t){var nx=SAL.filter(function(s){return s.t===t.id&&s.f>=TODAYS&&s.f<=iso(addD(TODAY,7))}),cap=nx.reduce(function(a,s){return a+s.cap},0),p=nx.reduce(function(a,s){return a+paxOf(s.id)},0);
    return '<div class="tc"><span class="eyebrow">'+t.ciudad+'</span><h4>'+esc(t.n)+'</h4><div class="meta"><span>'+t.dur+'</span><span>Sale '+t.h+' h</span><span>Cupo '+t.cap+'</span><span><b>'+money(t.precio)+'</b> por persona</span></div><div class="occ">Próximos 7 días · '+nx.length+' salidas · '+p+'/'+cap+' lugares</div><div class="prog"><i style="width:'+(cap?Math.round(p/cap*100):0)+'%"></i></div></div>'}).join('')+'</div><p class="mu" style="font-size:12.5px;margin-top:14px">Precios, horarios y cupos de ejemplo. En la versión real se cargan los suyos.</p>';
}
function rGuias(){
  var w=iso(addD(TODAY,6));
  return '<div class="card"><div class="tw"><table class="t"><thead><tr><th>Guía</th><th>Idiomas</th><th>Ciudad</th><th>Teléfono</th><th class="r">Salidas esta semana</th><th class="r">Pasajeros esta semana</th></tr></thead><tbody>'+
    GUIAS.map(function(g){var L=SAL.filter(function(s){return s.g===g.id&&s.f>=TODAYS&&s.f<=w});return '<tr><td><b style="font-weight:600">'+esc(g.n)+'</b></td><td>'+g.idi+'</td><td>'+g.ciudad+'</td><td class="num">'+g.tel+'</td><td class="r num">'+L.length+'</td><td class="r num">'+L.reduce(function(a,s){return a+paxOf(s.id)},0)+'</td></tr>'}).join('')+'</tbody></table></div></div>';
}

/* ===================== GUÍA (celular) ===================== */
function rMine(){
  var L=SAL.filter(function(s){return s.g===CU.g&&(s.f===TODAYS||s.f===iso(addD(TODAY,1)))&&paxOf(s.id)>0&&salSt(s)!=='Terminada'}).sort(function(a,b){return (a.f+a.h)<(b.f+b.h)?-1:1});
  if(!L.length)return '<div class="mine"><div class="mc"><b>No tienes salidas hoy ni mañana.</b></div></div>';
  return '<div class="mine">'+L.map(function(s){var t=tourBy(s.t),P=pickups(s),cob=resOf(s.id).reduce(function(a,r){return a+saldo(r)},0);
    return '<div class="mc"><div class="mc-top"><span class="h num">'+s.h+'</span><span class="tag">'+fDay(s.f)+'</span><span style="margin-left:auto">'+badge(salSt(s))+'</span></div><b style="font-size:16px;color:var(--ink)">'+esc(t.n)+'</b><div class="mu" style="font-size:13px;margin-top:3px">'+paxOf(s.id)+' pasajeros · '+(s.veh||'vehículo por confirmar')+' · cobrar en ruta '+money(cob)+'</div>'+
      P.map(function(p){return '<div style="margin-top:14px"><div style="display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)"><span class="num">'+p.h+'</span>'+esc(p.hotel)+'</div>'+p.res.map(function(r){var on=UI.boarded[r.id];return '<div class="gpk"><div><b style="font-weight:600">'+esc(r.cli)+'</b> · '+r.pax+(r.pax>1?' personas':' persona')+(saldo(r)?'<div style="color:var(--warn);font-size:13px;font-weight:600">Cobrar '+money(saldo(r))+'</div>':'')+'</div><button class="chk'+(on?' on':'')+'" onclick="board(\''+r.id+'\')" title="Abordó">'+ico('check')+'</button></div>'}).join('')+'</div>'}).join('')+'</div>'}).join('')+'</div>';
}
function board(id){UI.boarded[id]=!UI.boarded[id];render('mine');toast(UI.boarded[id]?'Marcado: ya abordó':'Desmarcado')}
</script>
<script>
/* ===================== PDFs ===================== */
function hexRgb(h){h=h.replace('#','');return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function pdfSafe(t){return String(t||'').replace(/[→⇄]/g,'-').replace(/[“”]/g,'"').replace(/’/g,"'")}
function pdfBase(title,greet,lang){
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF. Revisa tu conexión.');return null}
  var doc=new jspdf.jsPDF({unit:'pt',format:'letter'}),W=612,ac=hexRgb(CONFIG.acento);
  doc.setFillColor(26,26,24);doc.rect(0,0,W,92,'F');
  doc.setTextColor(244,242,236);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setCharSpace(4);
  doc.text(pdfSafe(CONFIG.empresa.toUpperCase()),48,48);doc.setCharSpace(0);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(170,168,160);
  doc.text(lang==='en'?'Tours and travel · Cusco, Peru':'Tours y viajes · Cusco, Perú',48,66);
  doc.setFillColor(ac[0],ac[1],ac[2]);doc.rect(0,92,W,3,'F');
  doc.setTextColor(26,26,24);doc.setFont('times','italic');doc.setFontSize(30);doc.text(pdfSafe(title),48,150);
  if(greet){doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(70,70,64);doc.text(pdfSafe(greet),48,178,{maxWidth:516})}
  return doc;
}
function pdfSection(doc,y,label,pairs){
  var ac=hexRgb(CONFIG.acento);
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setCharSpace(2.4);doc.setTextColor(ac[0],ac[1],ac[2]);doc.text(pdfSafe(label.toUpperCase()),48,y);doc.setCharSpace(0);
  doc.setDrawColor(228,225,216);doc.setLineWidth(.8);doc.line(48,y+8,564,y+8);y+=30;
  for(var i=0;i<pairs.length;i+=2){
    [pairs[i],pairs[i+1]].forEach(function(p,j){if(!p)return;var x=48+j*262;
      doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(130,128,120);doc.text(pdfSafe(p[0]),x,y);
      doc.setFontSize(11);doc.setTextColor(26,26,24);doc.text(pdfSafe(p[1]),x,y+15,{maxWidth:240})});
    y+=42;
  }
  return y+6;
}
function pdfBadge(doc,x,y,txt,rgb){doc.setFont('helvetica','bold');doc.setFontSize(8.5);var w=doc.getTextWidth(txt)+20;doc.setFillColor(rgb[0],rgb[1],rgb[2]);doc.roundedRect(x,y,w,20,10,10,'F');doc.setTextColor(255,255,255);doc.text(txt,x+10,y+13.5)}
function pdfFooter(doc,lang){
  doc.setDrawColor(228,225,216);doc.line(48,722,564,722);
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setCharSpace(2);doc.setTextColor(26,26,24);doc.text(pdfSafe(CONFIG.corto.toUpperCase()),48,742);doc.setCharSpace(0);
  doc.setFont('helvetica','normal');doc.setTextColor(130,128,120);doc.text(CONFIG.telefono+'  ·  '+CONFIG.correo,564,742,{align:'right'});
  doc.setFontSize(7.5);doc.text(lang==='en'?'Demo document with fictitious data.':'Documento de demostración con datos ficticios.',48,758);
}
function fileName(tipo,cli,f){return 'CuscoMistico_'+tipo+'_'+cli.split(/\s+/).pop().replace(/[^\wÁÉÍÓÚÑáéíóúñ]/g,'')+'_'+f.replace(/-/g,'')+'.pdf'}
function pdfConf(id){
  var r=resBy(id),s=salBy(r.sal),t=tourBy(s.t),L=langOf(r.tel),en=L==='en',first=r.cli.split(/\s+/)[0],g=guiaBy(s.g);
  var doc=pdfBase(en?'Booking confirmed':'Reserva confirmada',en?'Hello '+first+', thank you for traveling with us. Here are the details of your tour.':'Hola '+first+', gracias por viajar con nosotros. Aquí están los detalles de tu tour.',L);if(!doc)return;
  var paid=saldo(r)===0;pdfBadge(doc,48,196,en?(paid?'PAID IN FULL':'BALANCE DUE AT PICKUP'):(paid?'PAGADO':'SALDO EN EL RECOJO'),paid?[27,107,79]:[183,121,31]);
  var y=pdfSection(doc,250,en?'Your tour':'Tu tour',[[en?'Tour':'Tour',t.n],[en?'Duration':'Duración',en?t.dur.replace('días','days').replace('noches','nights').replace('noche','night').replace('día','day').replace('Medio día','Half day'):t.dur],[en?'Date':'Fecha',fLong(s.f,L)],[en?'Guests':'Personas',String(r.pax)]]);
  y=pdfSection(doc,y,en?'Hotel pickup':'Recojo en tu hotel',[[en?'Pickup time':'Hora de recojo',fTime(pickOf(r),L)],[en?'Hotel':'Hotel',r.hotel],[en?'Guide':'Guía',g?g.n+' ('+g.idi+')':(en?'Assigned the day before':'Se asigna un día antes')],[en?'Booking number':'Folio',r.folio]]);
  y=pdfSection(doc,y,en?'Payment':'Pago',[[en?'Total':'Total',money(r.total)],[en?'Paid':'Pagado',money(pagado(r))],[en?'Balance':'Saldo',money(saldo(r))]]);
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90,90,84);
  doc.text(pdfSafe(en?'Please be ready in your hotel lobby 5 minutes before your pickup time. Bring warm clothes, sunscreen and your passport.':'Te esperamos en el lobby de tu hotel 5 minutos antes de la hora de recojo. Trae ropa abrigadora, bloqueador y tu documento de identidad.'),48,y+4,{maxWidth:516});
  pdfFooter(doc,L);doc.save(fileName(en?'Confirmation':'Confirmacion',r.cli,s.f));
}
function pdfManifest(id){
  var s=salBy(id),t=tourBy(s.t),g=guiaBy(s.g),P=pickups(s);
  var doc=pdfBase('Manifiesto de salida','',null);if(!doc)return;
  var y=pdfSection(doc,190,'Salida',[['Tour',t.n],['Fecha y hora',fLong(s.f)+' · '+s.h+' h'],['Guía',g?g.n:'Sin asignar'],['Vehículo',s.veh||'Por asignar'],['Pasajeros',paxOf(id)+' de '+s.cap],['Por cobrar en ruta',money(resOf(id).reduce(function(a,r){return a+saldo(r)},0))]]);
  var ac=hexRgb(CONFIG.acento);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setCharSpace(2.4);doc.setTextColor(ac[0],ac[1],ac[2]);doc.text('RUTA DE RECOJO',48,y);doc.setCharSpace(0);doc.setDrawColor(228,225,216);doc.line(48,y+8,564,y+8);y+=28;
  P.forEach(function(p){if(y>690){doc.addPage();y=60}doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(26,26,24);doc.text(p.h+'   '+pdfSafe(p.hotel),48,y);y+=16;
    p.res.forEach(function(r){doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(70,70,64);doc.text(pdfSafe(r.cli+' · '+r.pax+' pax · '+r.tel),66,y);doc.text(saldo(r)?'Cobrar '+money(saldo(r)):'Pagado',564,y,{align:'right'});y+=14});y+=8});
  pdfFooter(doc,'es');doc.save('CuscoMistico_Manifiesto_'+t.n.split(' ')[0]+'_'+s.f.replace(/-/g,'')+'.pdf');
}

/* ===================== Excel ===================== */
function xls(rows,name,sheet){if(!window.XLSX){toast('No se pudo cargar Excel. Revisa tu conexión.');return}var ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);XLSX.writeFile(wb,'CuscoMistico_'+name+'_'+TODAYS.replace(/-/g,'')+'.xlsx')}
function xlsRes(){xls(resFiltered().map(function(r){var s=salBy(r.sal);return {Folio:r.folio,Pasajero:r.cli,Pais:r.pais,Telefono:r.tel,Tour:tourBy(s.t).n,Fecha:fLong(s.f),Hora:s.h,Recojo:pickOf(r),Hotel:r.hotel,Personas:r.pax,Canal:r.canal,Total:r.total,Pagado:pagado(r),Saldo:saldo(r),Estatus:r.st}}),'Reservas','Reservas')}
function xlsSal(){xls(salList().map(function(s){var g=guiaBy(s.g);return {Fecha:fLong(s.f),Hora:s.h,Tour:tourBy(s.t).n,Ciudad:tourBy(s.t).ciudad,Pasajeros:paxOf(s.id),Cupo:s.cap,Guia:g?g.n:'',Vehiculo:s.veh,Estatus:salSt(s)}}),'Salidas','Salidas')}
function xlsManifest(id){var s=salBy(id),rows=[];pickups(s).forEach(function(p){p.res.forEach(function(r){rows.push({Recojo:p.h,Hotel:p.hotel,Pasajero:r.cli,Personas:r.pax,Telefono:r.tel,Saldo:saldo(r)})})});xls(rows,'Lista_'+s.f.replace(/-/g,''),'Pasajeros')}

/* ===================== arranque ===================== */
(function init(){
  document.documentElement.style.setProperty('--ac',CONFIG.acento);
  var ac=hexRgb(CONFIG.acento);document.documentElement.style.setProperty('--ac2','rgb('+Math.round(ac[0]*.78)+','+Math.round(ac[1]*.78)+','+Math.round(ac[2]*.78)+')');
  document.documentElement.style.setProperty('--acs','rgba('+ac.join(',')+',.11)');
  document.title=CONFIG.empresa+' · Panel de operación';
  ['lg-logo','sb-logo'].forEach(function(id){var e=$(id);if(CONFIG.logo){e.innerHTML='<img src="'+CONFIG.logo+'" alt="" style="max-width:100%;max-height:100%">';e.style.background='transparent'}else e.textContent=CONFIG.iniciales});
  $('lg-name').textContent=CONFIG.empresa;$('sb-name').textContent=CONFIG.corto;
  $('tb-date').textContent=fLong(TODAYS);
  try{if(localStorage.getItem('demo-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}
  if(!load()){genAll();save()}
  var r=null;try{r=sessionStorage.getItem(LSK+'-role')}catch(e){}
  var qp=(location.search.match(/[?&]rol=(\w+)/)||[])[1];if(qp&&USERS[qp])r=qp;
  if(r&&USERS[r])login(r);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')cM()});
})();
</script>
