<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ordanza · Propuestas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f12;--ink:#f3f3f1;--mut:#9a9ca3;--line:#24262c}
@media (prefers-color-scheme: light){:root{--bg:#fafaf8;--ink:#111214;--mut:#62656c;--line:#e3e3df}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px 16px}
main{max-width:460px;text-align:center}
.mark{font-weight:600;letter-spacing:.32em;font-size:13px;color:var(--mut);margin-bottom:28px}
h1{font-size:28px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
p{color:var(--mut);line-height:1.6;margin:0 0 28px}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="mark">ORDANZA</div>
  <h1>Propuestas privadas</h1>
  <p>Aquí publicamos las propuestas que preparamos para cada cliente. Si recibió un enlace, ábralo directamente.</p>
  <a href="https://ordanzacorp.com">ordanzacorp.com</a>
</main>
</body>
</html>
